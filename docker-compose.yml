version: '3'

services:
  iq-book:
    build: .
    ports:
      - "4000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/TestBook"
    volumes:
      - uploads:/usr/src/app/Profileimages  

  db:
    image: mysql:8.0
    container_name: db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: TestBook
    ports:
      - "3333:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  uploads: 
